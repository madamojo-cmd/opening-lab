name: Blundr aggregate unit validation

on:
  workflow_dispatch:
  push:
    branches:
      - feat/final-app-architecture-onboarding
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "tests/**"
      - "scripts/run-node-tests.mjs"
      - "scripts/validate-blundr-system-registry.mjs"
      - "scripts/validate-deep-minigame-catalog.mjs"
      - "docs/product/**"
      - "AGENTS.md"
      - "lib/blundr/stage2Coaching/stage2ApprovedContentInventory.generated.ts"
      - "tests/coach/stage2ApprovedContentAvailabilityMatchesBundles.test.ts"
      - "docs/2026-06-17/stage2-approved-content-source-package-checksums.json"
      - "docs/2026-06-17/stage2-approved-content-candidates-*.zip"
      - ".github/workflows/blundr-aggregate-unit.yml"

permissions:
  contents: read

concurrency:
  group: blundr-aggregate-unit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aggregate-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Materialize tracked Stage 2 test assets
        run: |
          set -eu
          git checkout --force "$GITHUB_SHA" -- \
            data/blundr/stage2-approved-content-approved-5openings-v1 \
            data/blundr/stage2-approved-content-approved-batches2to4-16openings-v1
          test -f data/blundr/stage2-approved-content-approved-5openings-v1/approved-packets.jsonl
          test -f data/blundr/stage2-approved-content-approved-batches2to4-16openings-v1/approved-packets.jsonl
      - name: Verify immutable approved Stage 2 source packages
        run: node scripts/verify-stage2-approved-source-packages.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install exact lockfile dependencies
        run: npm ci
      - name: Validate system registry and deep minigame catalog
        run: |
          npm run verify:registry
          npm run verify:deep-minigame-catalog
      - name: Run architecture visual contract
        run: npx vitest run tests/architecture/appShell.visual.test.ts
      - name: Run authoritative aggregate unit command
        id: aggregate
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/blundr-aggregate-unit.log"
          started="$(date +%s)"
          set +e
          npm run test:unit 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          ended="$(date +%s)"
          duration="$((ended - started))"
          total="$(sed -nE 's/^ℹ tests ([0-9]+)$/\1/p' "$log" | tail -n 1)"
          passed="$(sed -nE 's/^ℹ pass ([0-9]+)$/\1/p' "$log" | tail -n 1)"
          failed="$(sed -nE 's/^ℹ fail ([0-9]+)$/\1/p' "$log" | tail -n 1)"
          {
            echo "## Aggregate unit validation"
            echo "- Git SHA: $GITHUB_SHA"
            echo "- Command: \`npm run test:unit\`"
            echo "- Individual tests: ${total:-unknown}"
            echo "- Passed: ${passed:-unknown}"
            echo "- Failed: ${failed:-unknown}"
            echo "- Exit code: $status"
            echo "- Duration seconds: $duration"
            echo "- Complete log artifact: blundr-aggregate-unit-$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
          cp "$log" "$GITHUB_WORKSPACE/blundr-aggregate-unit.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload aggregate unit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blundr-aggregate-unit-${{ github.sha }}
          path: blundr-aggregate-unit.log
          if-no-files-found: warn
          retention-days: 30
