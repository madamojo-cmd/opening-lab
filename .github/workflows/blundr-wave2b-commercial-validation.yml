name: Blundr Wave 2B commercial validation

on:
  workflow_dispatch:
  push:
    branches:
      - launch/commercial-paywall-enforcement-20260904

permissions:
  contents: read

concurrency:
  group: blundr-wave2b-commercial-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser_qa_and_sandbox_proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: wave2b-validation
    env:
      WAVE2B_PREVIEW_URL: ${{ secrets.WAVE2B_PREVIEW_URL }}
      WAVE2B_QA_EMAIL: ${{ secrets.BLUNDR_QA_EMAIL }}
      WAVE2B_QA_PASSWORD: ${{ secrets.BLUNDR_QA_PASSWORD }}
      WAVE2B_QA_SUPABASE_UUID: ${{ secrets.WAVE2B_QA_SUPABASE_UUID }}
      WAVE2B_EXPECTED_SHA: ${{ github.sha }}
      WAVE2B_EXECUTE_SANDBOX_CHECKOUT: ${{ vars.WAVE2B_EXECUTE_SANDBOX_CHECKOUT }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PRO_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_PRO_MONTHLY_PRICE_ID }}
      STRIPE_PRO_ANNUAL_PRICE_ID: ${{ secrets.STRIPE_PRO_ANNUAL_PRICE_ID }}
      REVENUECAT_REST_API_KEY: ${{ secrets.REVENUECAT_REST_API_KEY }}
      REVENUECAT_PROJECT_ID: ${{ secrets.REVENUECAT_PROJECT_ID }}
      REVENUECAT_PRO_ENTITLEMENT_ID: ${{ secrets.REVENUECAT_PRO_ENTITLEMENT_ID }}
      REVENUECAT_OFFERING_ID: ${{ secrets.REVENUECAT_OFFERING_ID }}
      ARTIFACT_DIR: ${{ github.workspace }}/.tmp/wave2b-commercial-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Print exact validation SHA
        run: echo "Exact SHA $GITHUB_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium only
        run: npx playwright install --with-deps chromium

      - name: Preflight non-production configuration
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          node <<'NODE'
          const fs = require("node:fs");

          const artifactDir = process.env.ARTIFACT_DIR;
          const required = [
            { env: "WAVE2B_PREVIEW_URL", name: "WAVE2B_PREVIEW_URL" },
            { env: "WAVE2B_QA_EMAIL", name: "BLUNDR_QA_EMAIL" },
            { env: "WAVE2B_QA_PASSWORD", name: "BLUNDR_QA_PASSWORD" },
          ];
          const optionalSandbox = [
            { env: "WAVE2B_QA_SUPABASE_UUID", name: "WAVE2B_QA_SUPABASE_UUID" },
            { env: "STRIPE_SECRET_KEY", name: "STRIPE_SECRET_KEY" },
            { env: "STRIPE_PRO_MONTHLY_PRICE_ID", name: "STRIPE_PRO_MONTHLY_PRICE_ID" },
            { env: "STRIPE_PRO_ANNUAL_PRICE_ID", name: "STRIPE_PRO_ANNUAL_PRICE_ID" },
            { env: "REVENUECAT_REST_API_KEY", name: "REVENUECAT_REST_API_KEY" },
            { env: "REVENUECAT_PROJECT_ID", name: "REVENUECAT_PROJECT_ID" },
            { env: "REVENUECAT_PRO_ENTITLEMENT_ID", name: "REVENUECAT_PRO_ENTITLEMENT_ID" },
            { env: "REVENUECAT_OFFERING_ID", name: "REVENUECAT_OFFERING_ID" },
          ];
          const missingRequired = required
            .filter((config) => !process.env[config.env])
            .map((config) => config.name);
          const missingSandbox = optionalSandbox
            .filter((config) => !process.env[config.env])
            .map((config) => config.name);

          const result = {
            workflow: process.env.GITHUB_WORKFLOW,
            runId: process.env.GITHUB_RUN_ID,
            sha: process.env.GITHUB_SHA,
            previewHost: null,
            preflight: "failed",
            missingRequired,
            missingSandbox,
            sandboxProofAvailable: missingSandbox.length === 0,
          };

          function fail(message) {
            result.failure = message;
            fs.writeFileSync(
              `${artifactDir}/preflight.json`,
              `${JSON.stringify(result, null, 2)}\n`,
            );
            console.error(message);
            if (missingRequired.length) {
              console.error(`Missing required configuration: ${missingRequired.join(", ")}`);
            }
            if (missingSandbox.length) {
              console.error(`Missing sandbox proof configuration: ${missingSandbox.join(", ")}`);
            }
            process.exit(1);
          }

          if (missingRequired.length) {
            fail("Wave 2B validation preflight failed.");
          }

          let preview;
          try {
            preview = new URL(process.env.WAVE2B_PREVIEW_URL);
          } catch {
            fail("WAVE2B_PREVIEW_URL is not a valid URL.");
          }

          const host = preview.hostname.toLowerCase();
          result.previewHost = host;
          const blockedHosts = new Set([
            "blundr.com",
            "www.blundr.com",
            "app.blundr.com",
            "blundr.ai",
            "www.blundr.ai",
            "blundr.vercel.app",
          ]);
          if (preview.protocol !== "https:") {
            fail("WAVE2B_PREVIEW_URL must use HTTPS.");
          }
          if (blockedHosts.has(host)) {
            fail("WAVE2B_PREVIEW_URL resolves to a production Blundr host.");
          }
          if (host === "localhost" || host.endsWith(".local")) {
            fail("WAVE2B_PREVIEW_URL must be a remote non-production preview.");
          }
          if (process.env.STRIPE_SECRET_KEY?.startsWith("sk_live_")) {
            fail("Live-mode Stripe credentials are forbidden for Wave 2B validation.");
          }
          if (process.env.STRIPE_SECRET_KEY && !process.env.STRIPE_SECRET_KEY.startsWith("sk_test_")) {
            fail("STRIPE_SECRET_KEY must be test-mode when provided.");
          }
          if (
            process.env.REVENUECAT_PRO_ENTITLEMENT_ID &&
            process.env.REVENUECAT_PRO_ENTITLEMENT_ID !== "pro"
          ) {
            fail("RevenueCat entitlement identifier must be pro.");
          }
          if (
            process.env.REVENUECAT_OFFERING_ID &&
            process.env.REVENUECAT_OFFERING_ID !== "default"
          ) {
            fail("RevenueCat offering identifier must be default.");
          }

          result.preflight = "passed";
          fs.writeFileSync(
            `${artifactDir}/preflight.json`,
            `${JSON.stringify(result, null, 2)}\n`,
          );
          console.log("Wave 2B validation preflight passed.");
          if (missingSandbox.length) {
            console.log(`Sandbox proof configuration not complete: ${missingSandbox.join(", ")}`);
          }
          NODE

      - name: Verify preview commit identity when exposed
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const artifactDir = process.env.ARTIFACT_DIR;
          const base = process.env.WAVE2B_PREVIEW_URL.replace(/\/+$/, "");
          const expected = process.env.WAVE2B_EXPECTED_SHA;

          async function readJson(path) {
            const response = await fetch(`${base}${path}`, { redirect: "manual" });
            if (!response.ok) {
              return { ok: false, status: response.status };
            }
            try {
              return { ok: true, status: response.status, body: await response.json() };
            } catch {
              return { ok: true, status: response.status, body: null };
            }
          }

          const probes = [
            ["/api/health", ["gitSha", "sha", "commit", "buildGitSha"]],
            ["/api/build-info", ["gitSha", "sha", "commit", "buildGitSha"]],
          ];
          const observations = [];
          let exposedSha = null;
          for (const [path, keys] of probes) {
            const result = await readJson(path);
            const redacted = { path, ok: result.ok, status: result.status, exposedSha: null };
            if (result.body && typeof result.body === "object") {
              for (const key of keys) {
                if (typeof result.body[key] === "string" && result.body[key]) {
                  exposedSha = result.body[key];
                  redacted.exposedSha = exposedSha;
                  break;
                }
              }
            }
            observations.push(redacted);
          }
          const identity = {
            expectedSha: expected,
            checked: observations,
            status: exposedSha ? (exposedSha === expected ? "matched" : "mismatched") : "not_exposed",
          };
          fs.writeFileSync(
            `${artifactDir}/preview-identity.json`,
            `${JSON.stringify(identity, null, 2)}\n`,
          );
          if (identity.status === "mismatched") {
            throw new Error("Preview deployment metadata exposes a different SHA.");
          }
          console.log(`Preview SHA identity ${identity.status}.`);
          NODE

      - name: Run Wave 2B browser QA
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR/screenshots"
          cat > "$ARTIFACT_DIR/wave2b-browser-qa.mjs" <<'NODE'
          import { chromium, expect } from "@playwright/test";
          import { writeFile } from "node:fs/promises";

          const baseUrl = process.env.WAVE2B_PREVIEW_URL.replace(/\/+$/, "");
          const qaEmail = process.env.WAVE2B_QA_EMAIL;
          const qaPassword = process.env.WAVE2B_QA_PASSWORD;
          const artifactDir = process.env.ARTIFACT_DIR;

          const viewports = [
            { name: "mobile", width: 390, height: 844 },
            { name: "tablet", width: 768, height: 1024 },
            { name: "desktop", width: 1440, height: 900 },
          ];

          const offerFixture = {
            ok: true,
            offer: {
              legalVersion: "wave2b-preview-validation",
              plan: "monthly",
              price: "$9.99",
              interval: "month",
              trialEligible: true,
              trialDays: 7,
              conversionTimestamp: "2026-09-11T17:00:00.000Z",
              cancelBeforeTimestamp: "2026-09-11T16:59:59.000Z",
              disclosure:
                "7 days free, then $9.99/month plus applicable taxes beginning September 11, 2026 at 5:00 PM UTC. Renews automatically until canceled. Cancel before September 11, 2026 at 4:59 PM UTC to avoid the first subscription charge.",
              acknowledgement:
                "I understand that my 7-day Blundr Pro trial requires a payment method and will automatically convert to the plan I selected on the date shown above unless I cancel before then.",
            },
          };

          function assertNoSensitiveText(text, label) {
            const forbidden = [
              qaEmail,
              process.env.WAVE2B_QA_SUPABASE_UUID,
            ].filter(Boolean);
            for (const value of forbidden) {
              if (text.includes(value)) {
                throw new Error(`${label} exposes private QA identity.`);
              }
            }
            if (/\b(?:sk_live|sk_test|whsec|rk_live|eyJ[A-Za-z0-9_-]{20,})\b/.test(text)) {
              throw new Error(`${label} exposes credential-like text.`);
            }
            if (/[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/i.test(text)) {
              throw new Error(`${label} exposes a UUID.`);
            }
          }

          async function installRoutes(page) {
            await page.route("**/api/blundr/onboarding/v11", async (route) => {
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify({
                  ok: true,
                  state: {
                    currentStep: "plan",
                    completed: false,
                    profile: {},
                    preferences: {},
                  },
                }),
              });
            });
            await page.route("**/api/blundr/billing/offer**", async (route) => {
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify(offerFixture),
              });
            });
            await page.route("**/api/blundr/billing/checkout", async (route) => {
              const body = route.request().postDataJSON();
              const keys = Object.keys(body ?? {}).sort();
              if (keys.join(",") !== "plan" || !["monthly", "annual"].includes(body.plan)) {
                throw new Error("Checkout request must contain only the plan enum.");
              }
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify({
                  ok: true,
                  url: `${baseUrl}/billing/success?session_id=cs_wave2b_redacted`,
                }),
              });
            });
            await page.route("**/api/blundr/billing/status", async (route) => {
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify({
                  ok: true,
                  access: {
                    plan: "free",
                    entitlementActive: false,
                    entitlementSource: "none",
                    trialActive: false,
                    expiresAt: null,
                    currentPeriodEnd: null,
                    cancelAtPeriodEnd: false,
                    dailyCardLimit: 5,
                    reviewCompletionLimit: 5,
                    activeOpeningLimit: 3,
                    premiumInsights: false,
                  },
                }),
              });
            });
            await page.route("**/api/blundr/billing/portal", async (route) => {
              const body = route.request().postData();
              if (body && /customer|stripe/i.test(body)) {
                throw new Error("Portal request must not include client customer authority.");
              }
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify({ ok: true, url: `${baseUrl}/settings?portal=redacted` }),
              });
            });
          }

          async function signIn(page) {
            await page.goto(`${baseUrl}/login?next=/onboarding/plan`, {
              waitUntil: "domcontentloaded",
            });
            const email = page.getByLabel(/email/i).or(page.locator('input[type="email"]')).first();
            const password = page
              .getByLabel(/password/i)
              .or(page.locator('input[type="password"]'))
              .first();
            await expect(email).toBeVisible({ timeout: 15000 });
            await email.fill(qaEmail);
            await password.fill(qaPassword);
            const submit = page
              .getByRole("button", { name: /sign in|log in|continue/i })
              .first();
            await submit.click();
            await page.waitForLoadState("networkidle").catch(() => {});
          }

          async function assertLayout(page, label) {
            const bodyText = await page.locator("body").innerText();
            assertNoSensitiveText(bodyText, label);
            const layout = await page.evaluate(() => {
              const width = window.innerWidth;
              const overflowing = [];
              for (const element of document.querySelectorAll("body *")) {
                const style = window.getComputedStyle(element);
                if (
                  style.display === "none" ||
                  style.visibility === "hidden" ||
                  Number.parseFloat(style.opacity || "1") === 0
                ) {
                  continue;
                }
                const rect = element.getBoundingClientRect();
                if (rect.width <= 0 || rect.height <= 0) continue;
                if (rect.left < -8 || rect.right > width + 8) {
                  overflowing.push({
                    tag: element.tagName,
                    text: (element.textContent || "").trim().slice(0, 80),
                    left: Math.round(rect.left),
                    right: Math.round(rect.right),
                  });
                }
              }
              return {
                documentOverflow: document.documentElement.scrollWidth > width + 8,
                overflowing,
              };
            });
            if (layout.documentOverflow || layout.overflowing.length) {
              throw new Error(`${label} has horizontal overflow or clipped controls.`);
            }
          }

          async function snapshot(page, viewport, label) {
            await assertLayout(page, `${viewport.name}-${label}`);
            await page.screenshot({
              path: `${artifactDir}/screenshots/${viewport.name}-${label}.png`,
              fullPage: true,
            });
          }

          async function validatePaywall(page, viewport) {
            await page.goto(`${baseUrl}/onboarding/plan`, { waitUntil: "domcontentloaded" });
            await expect(page.getByRole("heading", { name: /choose how you want to train/i })).toBeVisible();
            await expect(page.getByText(/keep training free, or try everything in blundr pro for 7 days/i)).toBeVisible();
            await expect(page.getByText("$9.99/month after trial")).toBeVisible();
            await expect(page.getByText("$69.99/year after trial")).toBeVisible();
            await expect(page.getByText(/save 42%/i)).toBeVisible();

            const monthly = page.getByRole("button", { name: /monthly/i }).first();
            const annual = page.getByRole("button", { name: /annual|best value/i }).first();
            await expect(monthly).not.toHaveAttribute("aria-pressed", "true");
            await expect(annual).not.toHaveAttribute("aria-pressed", "true");

            await monthly.click();
            const acknowledgement = page.getByRole("checkbox").first();
            await expect(acknowledgement).not.toBeChecked();
            await expect(page.getByText(/card required/i)).toBeVisible();
            await expect(page.getByText(/7 days free, then \$9\.99\/month plus applicable taxes beginning/i)).toBeVisible();
            await expect(page.getByText(/requires a payment method/i)).toBeVisible();
            const checkout = page.getByRole("button", { name: /start 7-day pro trial/i });
            await expect(checkout).toBeDisabled();
            await acknowledgement.check();
            await expect(checkout).toBeEnabled();
            await snapshot(page, viewport, "onboarding-paywall-monthly");

            await annual.click();
            await expect(page.getByText("$69.99/year after trial")).toBeVisible();
            await snapshot(page, viewport, "onboarding-paywall-annual");

            await page.getByRole("button", { name: /continue with free/i }).click();
            await page.waitForTimeout(300);
            if (/stripe\.com/i.test(page.url())) {
              throw new Error("Free path must not launch Stripe.");
            }
          }

          async function validateRoutes(page, viewport) {
            for (const [label, path, text] of [
              ["billing-success", "/billing/success?session_id=cs_wave2b_redacted", /being processed|confirmation|current plan|free/i],
              ["billing-cancel", "/billing/cancel", /cancel|choose|billing/i],
              ["settings-billing", "/settings#billing", /billing|current plan|free|manage/i],
              ["train", "/train", /train|opening|coach|continue/i],
              ["daily", "/daily", /daily|blundr|card/i],
              ["review", "/review", /review|queue|position/i],
              ["repertoire", "/repertoire", /repertoire|opening/i],
              ["progress", "/progress", /progress|mastery|streak/i],
              ["rings", "/rings", /ring|tempo|battery|blundr/i],
              ["rewards", "/rewards", /reward|streak|ring/i],
              ["minigames", "/minigames", /game|mini|puzzle/i],
            ]) {
              await page.goto(`${baseUrl}${path}`, { waitUntil: "domcontentloaded" });
              await page.waitForLoadState("networkidle").catch(() => {});
              await expect(page.locator("body")).toContainText(text, { timeout: 15000 });
              await snapshot(page, viewport, label);
            }
          }

          async function validateKeyboard(page) {
            await page.goto(`${baseUrl}/onboarding/plan`, { waitUntil: "domcontentloaded" });
            await page.keyboard.press("Tab");
            await page.keyboard.press("Tab");
            const focused = await page.evaluate(() => {
              const active = document.activeElement;
              if (!active || active === document.body) return null;
              const rect = active.getBoundingClientRect();
              const style = window.getComputedStyle(active);
              return {
                tag: active.tagName,
                role: active.getAttribute("role"),
                text: (active.textContent || "").trim().slice(0, 80),
                visible: rect.width > 0 && rect.height > 0,
                outline: style.outlineStyle,
                boxShadow: style.boxShadow,
              };
            });
            if (!focused?.visible) {
              throw new Error("Keyboard focus did not land on a visible control.");
            }
          }

          const browser = await chromium.launch();
          const summary = [];
          try {
            for (const viewport of viewports) {
              const context = await browser.newContext({ viewport });
              const page = await context.newPage();
              await installRoutes(page);
              await signIn(page);
              await installRoutes(page);
              await validatePaywall(page, viewport);
              await validateRoutes(page, viewport);
              await validateKeyboard(page);
              summary.push({ viewport: viewport.name, status: "passed" });
              await context.close();
            }
          } finally {
            await browser.close();
          }
          await writeFile(
            `${artifactDir}/browser-qa-summary.json`,
            `${JSON.stringify({ status: "passed", summary }, null, 2)}\n`,
          );
          NODE
          cat > "$ARTIFACT_DIR/wave2b-browser-qa.spec.mjs" <<'NODE'
          import { test } from "@playwright/test";
          import { execFileSync } from "node:child_process";

          test("Wave 2B responsive browser QA", () => {
            execFileSync(process.execPath, [
              `${process.env.ARTIFACT_DIR}/wave2b-browser-qa.mjs`,
            ], { stdio: "inherit" });
          });
          NODE
          cat > "$ARTIFACT_DIR/playwright.config.mjs" <<'NODE'
          export default {
            testDir: process.env.ARTIFACT_DIR,
            timeout: 180000,
            reporter: [
              ["line"],
              ["html", {
                outputFolder: `${process.env.ARTIFACT_DIR}/playwright-report`,
                open: "never",
              }],
              ["json", {
                outputFile: `${process.env.ARTIFACT_DIR}/playwright-report/results.json`,
              }],
            ],
            projects: [
              {
                name: "chromium",
                use: { browserName: "chromium" },
              },
            ],
            use: {
              screenshot: "only-on-failure",
              trace: "retain-on-failure",
              video: "off",
            },
          };
          NODE
          npx playwright test "$ARTIFACT_DIR/wave2b-browser-qa.spec.mjs" \
            --config "$ARTIFACT_DIR/playwright.config.mjs" \
            --project chromium

      - name: Run Wave 2B Stripe and RevenueCat sandbox proof when configured
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const Stripe = require("stripe");

          const artifactDir = process.env.ARTIFACT_DIR;
          const required = [
            { env: "WAVE2B_PREVIEW_URL", name: "WAVE2B_PREVIEW_URL" },
            { env: "WAVE2B_QA_EMAIL", name: "BLUNDR_QA_EMAIL" },
            { env: "WAVE2B_QA_PASSWORD", name: "BLUNDR_QA_PASSWORD" },
            { env: "WAVE2B_QA_SUPABASE_UUID", name: "WAVE2B_QA_SUPABASE_UUID" },
            { env: "STRIPE_SECRET_KEY", name: "STRIPE_SECRET_KEY" },
            { env: "STRIPE_PRO_MONTHLY_PRICE_ID", name: "STRIPE_PRO_MONTHLY_PRICE_ID" },
            { env: "STRIPE_PRO_ANNUAL_PRICE_ID", name: "STRIPE_PRO_ANNUAL_PRICE_ID" },
            { env: "REVENUECAT_REST_API_KEY", name: "REVENUECAT_REST_API_KEY" },
            { env: "REVENUECAT_PROJECT_ID", name: "REVENUECAT_PROJECT_ID" },
            { env: "REVENUECAT_PRO_ENTITLEMENT_ID", name: "REVENUECAT_PRO_ENTITLEMENT_ID" },
            { env: "REVENUECAT_OFFERING_ID", name: "REVENUECAT_OFFERING_ID" },
          ];
          const missing = required
            .filter((config) => !process.env[config.env])
            .map((config) => config.name);
          const proof = {
            status: missing.length ? "configuration_pending" : "started",
            missingConfigurationNames: missing,
            previewUrl: process.env.WAVE2B_PREVIEW_URL || null,
            checkoutSessionId: null,
            stripeEventIds: [],
            revenueCatSandboxCustomerId: null,
            entitlementBefore: null,
            entitlementAfter: null,
            checks: {},
          };

          function write() {
            fs.writeFileSync(
              `${artifactDir}/sandbox-proof.json`,
              `${JSON.stringify(proof, null, 2)}\n`,
            );
          }

          if (missing.length) {
            write();
            console.log(`Sandbox proof pending configuration: ${missing.join(", ")}`);
            process.exit(0);
          }
          if (!process.env.STRIPE_SECRET_KEY.startsWith("sk_test_")) {
            throw new Error("STRIPE_SECRET_KEY must be test-mode.");
          }
          if (process.env.REVENUECAT_PRO_ENTITLEMENT_ID !== "pro") {
            throw new Error("RevenueCat entitlement identifier must be pro.");
          }
          if (process.env.REVENUECAT_OFFERING_ID !== "default") {
            throw new Error("RevenueCat offering identifier must be default.");
          }

          (async () => {
            const stripe = new Stripe(process.env.STRIPE_SECRET_KEY);
            const monthly = await stripe.prices.retrieve(process.env.STRIPE_PRO_MONTHLY_PRICE_ID);
            const annual = await stripe.prices.retrieve(process.env.STRIPE_PRO_ANNUAL_PRICE_ID);
            if (monthly.livemode || annual.livemode) {
              throw new Error("Configured Stripe prices must be test-mode objects.");
            }
            if (!monthly.active || monthly.unit_amount !== 999 || monthly.recurring?.interval !== "month") {
              throw new Error("Monthly Stripe price does not match the Wave 2B contract.");
            }
            if (!annual.active || annual.unit_amount !== 6999 || annual.recurring?.interval !== "year") {
              throw new Error("Annual Stripe price does not match the Wave 2B contract.");
            }
            proof.checks.stripePriceVerified = true;

            if (process.env.WAVE2B_EXECUTE_SANDBOX_CHECKOUT !== "true") {
              proof.status = "operator_checkout_required";
              proof.operatorChecklist = [
                "Run the checked-out workflow with WAVE2B_EXECUTE_SANDBOX_CHECKOUT=true only in the wave2b-validation environment.",
                "Use the dedicated non-production QA account.",
                "Verify app-created Checkout uses only the monthly or annual enum and the expected test price.",
                "Record the redacted Checkout Session ID, Stripe event IDs, RevenueCat sandbox customer ID, and trusted entitlement before/after reconciliation in the workflow artifact.",
              ];
              write();
              console.log("Stripe prices verified. End-to-end sandbox checkout remains operator gated.");
              return;
            }

            proof.status = "automated_checkout_not_enabled";
            proof.operatorChecklist = [
              "The workflow guard verified test-mode Stripe price objects.",
              "Complete the hosted Checkout journey with the dedicated QA user from the preview URL.",
              "Confirm webhook and RevenueCat reconciliation evidence without printing credentials or personal data.",
            ];
            write();
            console.log("Automated checkout flag was enabled, but external hosted checkout/webhook proof requires operator evidence.");
          })().catch((error) => {
            proof.status = "failed";
            proof.error = error instanceof Error ? error.message : String(error);
            write();
            throw error;
          });
          NODE

      - name: Publish Wave 2B validation summary
        if: always()
        run: |
          {
            echo "## Wave 2B commercial validation"
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Tested SHA: $GITHUB_SHA"
            echo "- Environment: wave2b-validation"
            echo "- Preview URL: stored in WAVE2B_PREVIEW_URL"
            echo "- Responsive QA artifact: browser-qa-summary.json"
            echo "- Sandbox proof artifact: sandbox-proof.json"
            echo "- Production touched: no"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Wave 2B validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blundr-wave2b-commercial-validation-${{ github.sha }}
          path: ${{ github.workspace }}/.tmp/wave2b-commercial-validation
          if-no-files-found: warn
          retention-days: 30
