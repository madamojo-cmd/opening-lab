name: Blundr Wave 2B commercial validation

on:
  workflow_dispatch:
  push:
    branches:
      - launch/commercial-paywall-enforcement-20260904

permissions:
  contents: read

concurrency:
  group: blundr-wave2b-commercial-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser_qa_and_sandbox_proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: wave2b-validation
    env:
      WAVE2B_PREVIEW_URL: ${{ secrets.WAVE2B_PREVIEW_URL }}
      WAVE2B_QA_EMAIL: ${{ secrets.BLUNDR_QA_EMAIL }}
      WAVE2B_QA_PASSWORD: ${{ secrets.BLUNDR_QA_PASSWORD }}
      WAVE2B_QA_SUPABASE_UUID: ${{ secrets.WAVE2B_QA_SUPABASE_UUID }}
      WAVE2B_EXPECTED_SHA: ${{ github.sha }}
      WAVE2B_EXECUTE_SANDBOX_CHECKOUT: ${{ vars.WAVE2B_EXECUTE_SANDBOX_CHECKOUT }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PRO_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_PRO_MONTHLY_PRICE_ID }}
      STRIPE_PRO_ANNUAL_PRICE_ID: ${{ secrets.STRIPE_PRO_ANNUAL_PRICE_ID }}
      REVENUECAT_REST_API_KEY: ${{ secrets.REVENUECAT_REST_API_KEY }}
      REVENUECAT_PROJECT_ID: ${{ secrets.REVENUECAT_PROJECT_ID }}
      REVENUECAT_PRO_ENTITLEMENT_ID: ${{ secrets.REVENUECAT_PRO_ENTITLEMENT_ID }}
      REVENUECAT_OFFERING_ID: ${{ secrets.REVENUECAT_OFFERING_ID }}
      ARTIFACT_DIR: ${{ github.workspace }}/.tmp/wave2b-commercial-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Print exact validation SHA
        run: echo "Exact SHA $GITHUB_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium only
        run: npx playwright install --with-deps chromium

      - name: Preflight non-production configuration
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          node <<'NODE'
          const fs = require("node:fs");

          const artifactDir = process.env.ARTIFACT_DIR;
          const required = [
            { env: "WAVE2B_PREVIEW_URL", name: "WAVE2B_PREVIEW_URL" },
            { env: "WAVE2B_QA_EMAIL", name: "BLUNDR_QA_EMAIL" },
            { env: "WAVE2B_QA_PASSWORD", name: "BLUNDR_QA_PASSWORD" },
          ];
          const optionalSandbox = [
            { env: "WAVE2B_QA_SUPABASE_UUID", name: "WAVE2B_QA_SUPABASE_UUID" },
            { env: "STRIPE_SECRET_KEY", name: "STRIPE_SECRET_KEY" },
            { env: "STRIPE_PRO_MONTHLY_PRICE_ID", name: "STRIPE_PRO_MONTHLY_PRICE_ID" },
            { env: "STRIPE_PRO_ANNUAL_PRICE_ID", name: "STRIPE_PRO_ANNUAL_PRICE_ID" },
            { env: "REVENUECAT_REST_API_KEY", name: "REVENUECAT_REST_API_KEY" },
            { env: "REVENUECAT_PROJECT_ID", name: "REVENUECAT_PROJECT_ID" },
            { env: "REVENUECAT_PRO_ENTITLEMENT_ID", name: "REVENUECAT_PRO_ENTITLEMENT_ID" },
            { env: "REVENUECAT_OFFERING_ID", name: "REVENUECAT_OFFERING_ID" },
          ];
          const missingRequired = required
            .filter((config) => !process.env[config.env])
            .map((config) => config.name);
          const missingSandbox = optionalSandbox
            .filter((config) => !process.env[config.env])
            .map((config) => config.name);

          const result = {
            workflow: process.env.GITHUB_WORKFLOW,
            runId: process.env.GITHUB_RUN_ID,
            sha: process.env.GITHUB_SHA,
            previewHost: null,
            preflight: "failed",
            missingRequired,
            missingSandbox,
            sandboxProofAvailable: missingSandbox.length === 0,
          };

          function fail(message) {
            result.failure = message;
            fs.writeFileSync(
              `${artifactDir}/preflight.json`,
              `${JSON.stringify(result, null, 2)}\n`,
            );
            console.error(message);
            if (missingRequired.length) {
              console.error(`Missing required configuration: ${missingRequired.join(", ")}`);
            }
            if (missingSandbox.length) {
              console.error(`Missing sandbox proof configuration: ${missingSandbox.join(", ")}`);
            }
            process.exit(1);
          }

          if (missingRequired.length) {
            fail("Wave 2B validation preflight failed.");
          }

          let preview;
          try {
            preview = new URL(process.env.WAVE2B_PREVIEW_URL);
          } catch {
            fail("WAVE2B_PREVIEW_URL is not a valid URL.");
          }

          const host = preview.hostname.toLowerCase();
          result.previewHost = host;
          const blockedHosts = new Set([
            "blundr.com",
            "www.blundr.com",
            "app.blundr.com",
            "blundr.ai",
            "www.blundr.ai",
            "blundr.vercel.app",
          ]);
          if (preview.protocol !== "https:") {
            fail("WAVE2B_PREVIEW_URL must use HTTPS.");
          }
          if (blockedHosts.has(host)) {
            fail("WAVE2B_PREVIEW_URL resolves to a production Blundr host.");
          }
          if (host === "localhost" || host.endsWith(".local")) {
            fail("WAVE2B_PREVIEW_URL must be a remote non-production preview.");
          }
          if (process.env.STRIPE_SECRET_KEY?.startsWith("sk_live_")) {
            fail("Live-mode Stripe credentials are forbidden for Wave 2B validation.");
          }
          if (process.env.STRIPE_SECRET_KEY && !process.env.STRIPE_SECRET_KEY.startsWith("sk_test_")) {
            fail("STRIPE_SECRET_KEY must be test-mode when provided.");
          }
          if (
            process.env.REVENUECAT_PRO_ENTITLEMENT_ID &&
            process.env.REVENUECAT_PRO_ENTITLEMENT_ID !== "pro"
          ) {
            fail("RevenueCat entitlement identifier must be pro.");
          }
          if (
            process.env.REVENUECAT_OFFERING_ID &&
            process.env.REVENUECAT_OFFERING_ID !== "default"
          ) {
            fail("RevenueCat offering identifier must be default.");
          }

          result.preflight = "passed";
          fs.writeFileSync(
            `${artifactDir}/preflight.json`,
            `${JSON.stringify(result, null, 2)}\n`,
          );
          console.log("Wave 2B validation preflight passed.");
          if (missingSandbox.length) {
            console.log(`Sandbox proof configuration not complete: ${missingSandbox.join(", ")}`);
          }
          NODE

      - name: Verify preview commit identity when exposed
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const artifactDir = process.env.ARTIFACT_DIR;
          const base = process.env.WAVE2B_PREVIEW_URL.replace(/\/+$/, "");
          const expected = process.env.WAVE2B_EXPECTED_SHA;

          async function readJson(path) {
            const response = await fetch(`${base}${path}`, { redirect: "manual" });
            try {
              return { ok: response.ok, status: response.status, body: await response.json() };
            } catch {
              return { ok: response.ok, status: response.status, body: null };
            }
          }

          function readPath(value, path) {
            return path.reduce((current, key) => current && typeof current === "object" ? current[key] : undefined, value);
          }

          function extractSha(body) {
            if (!body || typeof body !== "object") return null;
            const paths = [
              ["gitSha"],
              ["sha"],
              ["commit"],
              ["buildGitSha"],
              ["build", "gitSha"],
              ["build", "sha"],
              ["build", "commit"],
              ["build", "buildGitSha"],
            ];
            for (const path of paths) {
              const value = readPath(body, path);
              if (typeof value === "string" && /^[0-9a-f]{40}$/i.test(value)) return value.toLowerCase();
            }
            return null;
          }

          function summarizeBody(body) {
            if (!body || typeof body !== "object") return null;
            return {
              ready: typeof body.ready === "boolean" ? body.ready : null,
              buildReady: typeof body.build?.ready === "boolean" ? body.build.ready : null,
              buildIssues: Array.isArray(body.build?.issues) ? body.build.issues.map(String) : [],
              errorCode: typeof body.error === "string" ? body.error : typeof body.error?.code === "string" ? body.error.code : null,
            };
          }

          const probes = ["/api/health", "/api/build-info"];
          const observations = [];
          let exposedSha = null;
          for (const path of probes) {
            const result = await readJson(path);
            const candidate = extractSha(result.body);
            if (candidate) exposedSha = candidate;
            const redacted = { path, ok: result.ok, status: result.status, exposedSha: candidate, summary: summarizeBody(result.body) };
            observations.push(redacted);
          }
          const identity = {
            expectedSha: expected,
            checked: observations,
            status: exposedSha ? (exposedSha === expected ? "matched" : "mismatched") : "not_exposed",
          };
          fs.writeFileSync(
            `${artifactDir}/preview-identity.json`,
            `${JSON.stringify(identity, null, 2)}\n`,
          );
          if (identity.status === "mismatched") {
            throw new Error("Preview deployment metadata exposes a different SHA.");
          }
          if (identity.status === "not_exposed") {
            throw new Error("Preview deployment metadata did not expose a supported SHA field.");
          }
          console.log(`Preview SHA identity ${identity.status}.`);
          NODE

      - name: Run Wave 2B browser QA
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR/screenshots"
          cat > "$ARTIFACT_DIR/wave2b-browser-qa.mjs" <<'NODE'
          import { chromium, expect } from "@playwright/test";
          import { writeFile } from "node:fs/promises";

          const baseUrl = process.env.WAVE2B_PREVIEW_URL.replace(/\/+$/, "");
          const qaEmail = process.env.WAVE2B_QA_EMAIL;
          const qaPassword = process.env.WAVE2B_QA_PASSWORD;
          const qaUserId = process.env.WAVE2B_QA_SUPABASE_UUID;
          const artifactDir = process.env.ARTIFACT_DIR;

          const viewports = [
            { name: "mobile", width: 390, height: 844 },
            { name: "tablet", width: 768, height: 1024 },
            { name: "desktop", width: 1440, height: 900 },
          ];

          function createOfferFixture(plan) {
            const annual = plan === "annual";
            return {
              id: `wave2b-${plan}-offer`,
              legalVersion: "wave2b-preview-validation",
              plan,
              trialEligible: true,
              trialDays: 7,
              conversionTimestamp: "2026-09-11T17:00:00.000Z",
              cancelBeforeTimestamp: "2026-09-11T16:59:59.000Z",
              disclosure:
                `7 days free, then ${annual ? "$69.99/year" : "$9.99/month"} plus applicable taxes beginning September 11, 2026 at 5:00 PM UTC. Renews automatically until canceled. Cancel before September 11, 2026 at 4:59 PM UTC to avoid the first subscription charge.`,
              acknowledgement:
                "I understand that my 7-day Blundr Pro trial requires a payment method and will automatically convert to the plan I selected on the date shown above unless I cancel before then.",
            };
          }
          const onboardingSteps = [
            "welcome",
            "level",
            "priorities",
            "starter-pack",
            "training-mode",
            "pace",
            "line-changes",
            "review",
            "plan",
            "ready",
          ];
          const onboardingValues = {
            welcome: true,
            level: "1200-1600",
            priorities: ["remember_openings", "review_mistakes"],
            "starter-pack": "classical_attacker",
            "training-mode": "assisted",
            pace: "standard",
            "line-changes": null,
            review: null,
          };

          function redactText(value) {
            let text = String(value ?? "");
            for (const forbidden of [qaEmail, qaPassword, qaUserId].filter(Boolean)) {
              text = text.split(forbidden).join("[redacted]");
            }
            return text
              .replace(/\b(?:sk_live|sk_test|whsec|rk_live|eyJ[A-Za-z0-9_-]{20,})\b/g, "[redacted]")
              .replace(/[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/gi, "[redacted-uuid]");
          }

          function summarizeOnboardingBody(body) {
            return {
              ok: body?.ok === true,
              step: typeof body?.data?.step === "string" ? body.data.step : null,
              completed: body?.data?.completed === true,
              errorCode: typeof body?.error?.code === "string" ? body.error.code : null,
            };
          }

          function assertNoSensitiveText(text, label) {
            const forbidden = [
              qaEmail,
              process.env.WAVE2B_QA_SUPABASE_UUID,
            ].filter(Boolean);
            for (const value of forbidden) {
              if (text.includes(value)) {
                throw new Error(`${label} exposes private QA identity.`);
              }
            }
            if (/\b(?:sk_live|sk_test|whsec|rk_live|eyJ[A-Za-z0-9_-]{20,})\b/.test(text)) {
              throw new Error(`${label} exposes credential-like text.`);
            }
            if (/[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/i.test(text)) {
              throw new Error(`${label} exposes a UUID.`);
            }
          }

          async function installRoutes(page) {
            await page.route((url) => url.origin === baseUrl && url.pathname === "/api/blundr/billing/offer", async (route) => {
              const body = route.request().postDataJSON();
              const keys = Object.keys(body ?? {}).sort();
              if (keys.join(",") !== "plan" || !["monthly", "annual"].includes(body.plan)) {
                throw new Error("Offer request must contain only the plan enum.");
              }
              const offer = createOfferFixture(body.plan);
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify({ ok: true, data: offer }),
              });
            });
            await page.route((url) => url.origin === baseUrl && url.pathname === "/api/blundr/billing/offer/accept", async (route) => {
              const body = route.request().postDataJSON();
              const keys = Object.keys(body ?? {}).sort();
              if (keys.join(",") !== "offerId,plan" || !["monthly", "annual"].includes(body.plan)) {
                throw new Error("Offer acceptance request must contain only offerId and the plan enum.");
              }
              if (body.offerId !== createOfferFixture(body.plan).id) {
                throw new Error("Offer acceptance must use the offer ID for the selected plan.");
              }
              const serialized = JSON.stringify(body);
              if (/price|amount|user|customer|entitlement|pro|subscription/i.test(serialized)) {
                throw new Error("Offer acceptance must not include client-controlled billing authority.");
              }
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify({ ok: true }),
              });
            });
            await page.route((url) => url.origin === baseUrl && url.pathname === "/api/blundr/billing/checkout", async (route) => {
              const body = route.request().postDataJSON();
              const keys = Object.keys(body ?? {}).sort();
              if (keys.join(",") !== "plan" || !["monthly", "annual"].includes(body.plan)) {
                throw new Error("Checkout request must contain only the plan enum.");
              }
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify({
                  ok: true,
                  data: { url: `${baseUrl}/billing/success?session_id=cs_wave2b_redacted` },
                }),
              });
            });
            await page.route((url) => url.origin === baseUrl && url.pathname === "/api/blundr/billing/status", async (route) => {
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify({
                  ok: true,
                  data: {
                    plan: "free",
                    entitlementActive: false,
                    entitlementSource: "none",
                    trialActive: false,
                    expiresAt: null,
                    currentPeriodEnd: null,
                    cancelAtPeriodEnd: false,
                    dailyCardLimit: 5,
                    reviewCompletionLimit: 5,
                    activeOpeningLimit: 3,
                    premiumInsights: false,
                  },
                }),
              });
            });
            await page.route((url) => url.origin === baseUrl && url.pathname === "/api/blundr/billing/portal", async (route) => {
              const body = route.request().postData();
              if (body && /customer|stripe/i.test(body)) {
                throw new Error("Portal request must not include client customer authority.");
              }
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify({ ok: true, data: { url: `${baseUrl}/settings?portal=redacted` } }),
              });
            });
          }

          async function signIn(page) {
            await page.goto(`${baseUrl}/login?next=/onboarding/plan`, {
              waitUntil: "domcontentloaded",
            });
            const email = page.getByLabel(/email/i).or(page.locator('input[type="email"]')).first();
            const password = page
              .getByLabel(/password/i)
              .or(page.locator('input[type="password"]'))
              .first();
            await expect(email).toBeVisible({ timeout: 15000 });
            await email.fill(qaEmail);
            await password.fill(qaPassword);
            const submit = page
              .getByRole("button", { name: /sign in|log in|continue/i })
              .first();
            await submit.click();
            await page.waitForLoadState("networkidle").catch(() => {});
          }

          function installPageDiagnostics(page) {
            const diagnostics = {
              responses: [],
              requestFailures: [],
              consoleErrors: [],
              pageErrors: [],
            };
            const interesting = new Set([
              "/login",
              "/onboarding/plan",
              "/api/blundr/onboarding/v11",
              "/api/blundr/dev/reset-user",
              "/api/blundr/billing/offer",
              "/api/blundr/billing/checkout",
              "/api/blundr/billing/status",
              "/api/blundr/billing/portal",
            ]);
            function pathFor(url) {
              try {
                const parsed = new URL(url);
                if (parsed.origin !== baseUrl) return null;
                return parsed.pathname;
              } catch {
                return null;
              }
            }
            page.on("response", (response) => {
              const path = pathFor(response.url());
              if (!path || !interesting.has(path)) return;
              diagnostics.responses.push({
                path,
                status: response.status(),
                ok: response.ok(),
              });
            });
            page.on("requestfailed", (request) => {
              const path = pathFor(request.url());
              if (!path) return;
              diagnostics.requestFailures.push({
                path,
                method: request.method(),
                resourceType: request.resourceType(),
                failure: redactText(request.failure()?.errorText ?? "unknown"),
              });
            });
            page.on("console", (message) => {
              if (message.type() === "error") {
                diagnostics.consoleErrors.push(redactText(message.text()).slice(0, 500));
              }
            });
            page.on("pageerror", (error) => {
              diagnostics.pageErrors.push(redactText(error.message).slice(0, 500));
            });
            return diagnostics;
          }

          async function redactPageForScreenshot(page) {
            await page.evaluate(() => {
              for (const input of document.querySelectorAll("input")) {
                const type = input.getAttribute("type") || "";
                if (/email|password|text|search|tel/i.test(type)) {
                  input.value = "";
                  input.setAttribute("value", "");
                }
              }
            }).catch(() => {});
          }

          async function readBrowserSession(page) {
            return page.evaluate((expectedUserId) => {
              function findSession(value) {
                if (!value || typeof value !== "object") return null;
                if (
                  typeof value.access_token === "string" &&
                  value.access_token &&
                  value.user &&
                  typeof value.user.id === "string"
                ) {
                  return { accessToken: value.access_token, userId: value.user.id };
                }
                for (const child of Object.values(value)) {
                  const found = findSession(child);
                  if (found) return found;
                }
                return null;
              }
              for (const key of Object.keys(window.localStorage)) {
                const raw = window.localStorage.getItem(key);
                if (!raw) continue;
                try {
                  const found = findSession(JSON.parse(raw));
                  if (found) {
                    return {
                      authenticated: true,
                      accessToken: found.accessToken,
                      userIdPresent: true,
                      userMatchesExpected: found.userId === expectedUserId,
                    };
                  }
                } catch {
                  // Ignore unrelated localStorage values.
                }
              }
              return {
                authenticated: false,
                accessToken: null,
                userIdPresent: false,
                userMatchesExpected: false,
              };
            }, qaUserId);
          }

          async function authenticatedJson(page, accessToken, path, init = {}) {
            return page.evaluate(
              async ({ accessToken, path, init }) => {
                const response = await fetch(path, {
                  ...init,
                  headers: {
                    accept: "application/json",
                    "content-type": "application/json",
                    authorization: `Bearer ${accessToken}`,
                    ...(init.headers || {}),
                  },
                  credentials: "same-origin",
                });
                const body = await response.json().catch(() => null);
                return { status: response.status, ok: response.ok, body };
              },
              { accessToken, path, init },
            );
          }

          async function readOnboardingState(page, accessToken) {
            const result = await authenticatedJson(page, accessToken, "/api/blundr/onboarding/v11");
            return {
              status: result.status,
              ok: result.ok,
              ...summarizeOnboardingBody(result.body),
            };
          }

          async function patchOnboardingStep(page, accessToken, step) {
            const result = await authenticatedJson(page, accessToken, "/api/blundr/onboarding/v11", {
              method: "PATCH",
              body: JSON.stringify({
                step,
                value: onboardingValues[step],
                ageConfirmed: step === "welcome" ? true : undefined,
              }),
            });
            return {
              status: result.status,
              ok: result.ok,
              ...summarizeOnboardingBody(result.body),
            };
          }

          async function resetQaOnboarding(page, accessToken) {
            const result = await authenticatedJson(page, accessToken, "/api/blundr/dev/reset-user", {
              method: "POST",
              body: JSON.stringify({
                scope: "onboarding",
                userId: qaUserId,
              }),
            });
            return {
              status: result.status,
              ok: result.ok,
              errorCode: typeof result.body?.error?.code === "string" ? result.body.error.code : null,
            };
          }

          async function ensureOnboardingPlanState(page, accessToken, diagnostics) {
            let state = await readOnboardingState(page, accessToken);
            diagnostics.initialOnboarding = state;
            if (!state.ok) return state;
            const planIndex = onboardingSteps.indexOf("plan");
            let currentIndex = onboardingSteps.indexOf(state.step);
            if (state.completed || currentIndex > planIndex) {
              diagnostics.resetAttempt = await resetQaOnboarding(page, accessToken);
              if (!diagnostics.resetAttempt.ok) return state;
              state = await readOnboardingState(page, accessToken);
              currentIndex = onboardingSteps.indexOf(state.step);
            }
            diagnostics.advancement = [];
            while (state.ok && !state.completed && state.step !== "plan") {
              currentIndex = onboardingSteps.indexOf(state.step);
              if (currentIndex < 0 || currentIndex >= planIndex) break;
              const patched = await patchOnboardingStep(page, accessToken, state.step);
              diagnostics.advancement.push({
                from: state.step,
                status: patched.status,
                ok: patched.ok,
                nextStep: patched.step,
                completed: patched.completed,
                errorCode: patched.errorCode,
              });
              state = patched;
            }
            diagnostics.finalOnboarding = state;
            return state;
          }

          async function writePaywallDiagnostics(page, viewport, diagnostics, sessionSummary, state, response) {
            const heading = await page.locator("h1").first().textContent().catch(() => null);
            const path = (() => {
              try {
                return new URL(page.url()).pathname;
              } catch {
                return "unknown";
              }
            })();
            const payload = {
              status: "before_paywall_assertion",
              authenticationSucceeded: sessionSummary.authenticated === true,
              userIdPresent: sessionSummary.userIdPresent === true,
              userMatchesExpected: sessionSummary.userMatchesExpected === true,
              currentPathname: path,
              pageHttpStatus: response?.status() ?? null,
              onboardingApiStatus: state.status,
              currentOnboardingStep: state.step,
              onboardingCompleted: state.completed,
              visibleHeading: redactText(heading),
              responses: diagnostics.responses.slice(-20),
              requestFailures: diagnostics.requestFailures.slice(-20),
              consoleErrors: diagnostics.consoleErrors.slice(-20),
              pageErrors: diagnostics.pageErrors.slice(-20),
              initialOnboarding: diagnostics.initialOnboarding,
              finalOnboarding: diagnostics.finalOnboarding,
              resetAttempt: diagnostics.resetAttempt ?? null,
              advancement: diagnostics.advancement ?? [],
            };
            await writeFile(
              `${artifactDir}/browser-diagnostics-${viewport.name}-before-paywall.json`,
              `${JSON.stringify(payload, null, 2)}\n`,
            );
            await redactPageForScreenshot(page);
            await page.screenshot({
              path: `${artifactDir}/screenshots/${viewport.name}-before-paywall.png`,
              fullPage: true,
            });
            assertNoSensitiveText(await page.locator("body").innerText(), `${viewport.name}-before-paywall`);
          }

          async function assertLayout(page, label) {
            const bodyText = await page.locator("body").innerText();
            assertNoSensitiveText(bodyText, label);
            const layout = await page.evaluate(() => {
              const width = window.innerWidth;
              const overflowing = [];
              for (const element of document.querySelectorAll("body *")) {
                const style = window.getComputedStyle(element);
                if (
                  style.display === "none" ||
                  style.visibility === "hidden" ||
                  Number.parseFloat(style.opacity || "1") === 0
                ) {
                  continue;
                }
                const rect = element.getBoundingClientRect();
                if (rect.width <= 0 || rect.height <= 0) continue;
                if (rect.left < -8 || rect.right > width + 8) {
                  overflowing.push({
                    tag: element.tagName,
                    text: (element.textContent || "").trim().slice(0, 80),
                    left: Math.round(rect.left),
                    right: Math.round(rect.right),
                  });
                }
              }
              return {
                documentOverflow: document.documentElement.scrollWidth > width + 8,
                overflowing,
              };
            });
            if (layout.documentOverflow || layout.overflowing.length) {
              throw new Error(`${label} has horizontal overflow or clipped controls.`);
            }
          }

          async function snapshot(page, viewport, label) {
            await assertLayout(page, `${viewport.name}-${label}`);
            await page.screenshot({
              path: `${artifactDir}/screenshots/${viewport.name}-${label}.png`,
              fullPage: true,
            });
          }

          async function validatePaywall(page, viewport, diagnostics) {
            const sessionSummary = await readBrowserSession(page);
            if (!sessionSummary.authenticated || !sessionSummary.accessToken || !sessionSummary.userMatchesExpected) {
              await writePaywallDiagnostics(page, viewport, diagnostics, sessionSummary, { status: null, step: null, completed: null }, null);
              throw new Error("QA authentication did not produce the expected non-production user session.");
            }
            const state = await ensureOnboardingPlanState(page, sessionSummary.accessToken, diagnostics);
            const response = await page.goto(`${baseUrl}/onboarding/plan`, { waitUntil: "domcontentloaded" });
            await page.waitForLoadState("networkidle").catch(() => {});
            const currentState = await readOnboardingState(page, sessionSummary.accessToken);
            await writePaywallDiagnostics(page, viewport, diagnostics, sessionSummary, currentState, response);
            if (!state.ok || !currentState.ok) {
              throw new Error("Authenticated onboarding-state endpoint did not return a usable state.");
            }
            if (currentState.completed || currentState.step !== "plan") {
              throw new Error(`QA account is not at onboarding plan step; current step is ${currentState.step ?? "unknown"}.`);
            }
            await expect(page.getByRole("heading", { name: /choose how you want to train/i })).toBeVisible();
            await expect(page.getByText(/keep training free, or try everything in blundr pro for 7 days/i)).toBeVisible();
            await expect(page.getByText("$9.99/month after trial")).toBeVisible();
            await expect(page.getByText("$69.99/year after trial")).toBeVisible();
            await expect(page.getByText(/save 42%/i)).toBeVisible();

            const monthly = page.getByRole("button", { name: /monthly/i }).first();
            const annual = page.getByRole("button", { name: /annual|best value/i }).first();
            await expect(monthly).not.toHaveAttribute("aria-pressed", "true");
            await expect(annual).not.toHaveAttribute("aria-pressed", "true");

            async function waitForOfferResponse(plan, action) {
              const responsePromise = page.waitForResponse((response) => {
                const url = new URL(response.url());
                return (
                  url.origin === baseUrl &&
                  url.pathname === "/api/blundr/billing/offer" &&
                  response.request().method() === "POST"
                );
              });
              await action();
              const response = await responsePromise;
              if (!response.ok()) {
                throw new Error(`${plan} offer response failed with HTTP ${response.status()}.`);
              }
              const body = await response.json();
              if (body?.ok !== true || body?.data?.plan !== plan || body.data.id !== createOfferFixture(plan).id) {
                throw new Error(`${plan} offer response did not match the billing API contract.`);
              }
              return body.data;
            }

            const acknowledgementName = /I understand that my 7-day Blundr Pro trial requires a payment method and will automatically convert to the plan I selected/i;
            const monthlyOffer = await waitForOfferResponse("monthly", async () => {
              await monthly.click();
            });
            const acknowledgement = page.getByRole("checkbox", { name: acknowledgementName });
            await expect(acknowledgement).toBeVisible();
            await expect(acknowledgement).not.toBeChecked();
            await expect(page.getByText(/card required/i)).toBeVisible();
            if (!monthlyOffer.disclosure.includes("$9.99/month")) {
              throw new Error("Monthly offer disclosure does not include the monthly price.");
            }
            await expect(page.getByText(/7 days free, then \$9\.99\/month plus applicable taxes beginning/i)).toBeVisible();
            await expect(page.getByText(/requires a payment method/i)).toBeVisible();
            const checkout = page.getByRole("button", { name: /start 7-day pro trial/i });
            await expect(checkout).toBeDisabled();
            await acknowledgement.check();
            await expect(checkout).toBeEnabled();
            await snapshot(page, viewport, "onboarding-paywall-monthly");

            const annualOffer = await waitForOfferResponse("annual", async () => {
              await annual.click();
            });
            await expect(acknowledgement).toBeVisible();
            await expect(acknowledgement).not.toBeChecked();
            await expect(checkout).toBeDisabled();
            if (!annualOffer.disclosure.includes("$69.99/year")) {
              throw new Error("Annual offer disclosure does not include the annual price.");
            }
            await expect(page.getByText("$69.99/year after trial")).toBeVisible();
            await expect(page.getByText(/7 days free, then \$69\.99\/year plus applicable taxes beginning/i)).toBeVisible();
            await acknowledgement.check();
            await expect(checkout).toBeEnabled();
            await snapshot(page, viewport, "onboarding-paywall-annual");

            await page.getByRole("button", { name: /continue with free/i }).click();
            await page.waitForTimeout(300);
            if (/stripe\.com/i.test(page.url())) {
              throw new Error("Free path must not launch Stripe.");
            }
          }

          async function validateRoutes(page, viewport) {
            const routeChecks = [
              {
                label: "billing-success",
                path: "/billing/success?session_id=cs_wave2b_redacted",
                pathname: "/billing/success",
                heading: /Subscription confirmation is being processed\./i,
                requiredText: [/provider reconciliation/i, /Settings -> Billing/i],
              },
              {
                label: "billing-cancel",
                path: "/billing/cancel",
                pathname: "/billing/cancel",
                heading: /Checkout was canceled\./i,
                requiredText: [/No subscription change was made/i, /Plan selection/i],
              },
              {
                label: "settings-billing",
                path: "/settings#billing",
                pathname: "/settings",
                heading: /Account settings\./i,
                requiredText: [/Billing/i, /Current plan: Free/i],
              },
              {
                label: "train",
                path: "/train",
                pathname: "/train",
                heading: /Choose an opening\.|Loading your openings\.|Opening list unavailable\./i,
                requiredText: [/Unlocked openings only|checking which openings are ready|couldn't load your saved repertoire/i],
              },
              {
                label: "daily",
                path: "/daily",
                pathname: "/daily",
                heading: /Your Daily deck\./i,
                requiredText: [/First try counts/i, /Review · Daily Blundr/i],
              },
              {
                label: "review",
                path: "/review",
                pathname: "/review",
                heading: /Review what needs to stick\./i,
                requiredText: [/Review queue/i, /Minigames · separate from Daily/i],
              },
              {
                label: "repertoire",
                path: "/repertoire",
                pathname: "/repertoire",
                heading: /Your opening library\./i,
                requiredText: [/Repertoire/i, /Tempo Cache/i],
              },
              {
                label: "progress",
                path: "/progress",
                pathname: "/progress",
                heading: /Momentum, without noise\./i,
                requiredText: [/Daily rings/i, /Tempo/i, /Battery/i, /Daily Blundr/i, /STREAK & CONSISTENCY/i],
              },
              {
                label: "minigames",
                path: "/minigames",
                pathname: "/minigames",
                heading: /Review what needs to stick\./i,
                requiredText: [/Minigames · separate from Daily/i, /production practice games/i],
              },
            ];
            for (const check of routeChecks) {
              const response = await page.goto(`${baseUrl}${check.path}`, { waitUntil: "domcontentloaded" });
              if (!response) {
                throw new Error(`${check.label} did not produce a main-document response.`);
              }
              if (response.status() < 200 || response.status() >= 400) {
                throw new Error(`${check.label} returned HTTP ${response.status()}.`);
              }
              await page.waitForLoadState("networkidle").catch(() => {});
              const finalPath = new URL(page.url()).pathname;
              if (finalPath !== check.pathname) {
                throw new Error(`${check.label} ended on unexpected path ${finalPath}.`);
              }
              const bodyText = await page.locator("body").innerText();
              if (/404\s*This page could not be found|This page could not be found|Application error|Internal Server Error/i.test(bodyText)) {
                throw new Error(`${check.label} rendered a Not Found or generic error page.`);
              }
              await expect(page.getByRole("heading", { name: check.heading }).first()).toBeVisible({ timeout: 15000 });
              for (const text of check.requiredText) {
                await expect(page.getByText(text).first()).toBeVisible({ timeout: 15000 });
              }
              await snapshot(page, viewport, check.label);
            }
          }

          async function validateKeyboard(page) {
            await page.goto(`${baseUrl}/onboarding/plan`, { waitUntil: "domcontentloaded" });
            await page.keyboard.press("Tab");
            await page.keyboard.press("Tab");
            const focused = await page.evaluate(() => {
              const active = document.activeElement;
              if (!active || active === document.body) return null;
              const rect = active.getBoundingClientRect();
              const style = window.getComputedStyle(active);
              return {
                tag: active.tagName,
                role: active.getAttribute("role"),
                text: (active.textContent || "").trim().slice(0, 80),
                visible: rect.width > 0 && rect.height > 0,
                outline: style.outlineStyle,
                boxShadow: style.boxShadow,
              };
            });
            if (!focused?.visible) {
              throw new Error("Keyboard focus did not land on a visible control.");
            }
          }

          const browser = await chromium.launch();
          const summary = [];
          try {
            for (const viewport of viewports) {
              const context = await browser.newContext({ viewport });
              const page = await context.newPage();
              const pageDiagnostics = installPageDiagnostics(page);
              await installRoutes(page);
              await signIn(page);
              await installRoutes(page);
              await validatePaywall(page, viewport, pageDiagnostics);
              await validateRoutes(page, viewport);
              await validateKeyboard(page);
              summary.push({ viewport: viewport.name, status: "passed" });
              await context.close();
            }
          } finally {
            await browser.close();
          }
          await writeFile(
            `${artifactDir}/browser-qa-summary.json`,
            `${JSON.stringify({ status: "passed", summary }, null, 2)}\n`,
          );
          NODE
          cat > "$ARTIFACT_DIR/wave2b-browser-qa.spec.mjs" <<'NODE'
          import { test } from "@playwright/test";
          import { execFileSync } from "node:child_process";

          test("Wave 2B responsive browser QA", () => {
            execFileSync(process.execPath, [
              `${process.env.ARTIFACT_DIR}/wave2b-browser-qa.mjs`,
            ], { stdio: "inherit" });
          });
          NODE
          cat > "$ARTIFACT_DIR/playwright.config.mjs" <<'NODE'
          export default {
            testDir: process.env.ARTIFACT_DIR,
            timeout: 180000,
            reporter: [
              ["line"],
              ["html", {
                outputFolder: `${process.env.ARTIFACT_DIR}/playwright-report`,
                open: "never",
              }],
              ["json", {
                outputFile: `${process.env.ARTIFACT_DIR}/playwright-report/results.json`,
              }],
            ],
            projects: [
              {
                name: "chromium",
                use: { browserName: "chromium" },
              },
            ],
            use: {
              screenshot: "only-on-failure",
              trace: "retain-on-failure",
              video: "off",
            },
          };
          NODE
          npx playwright test "$ARTIFACT_DIR/wave2b-browser-qa.spec.mjs" \
            --config "$ARTIFACT_DIR/playwright.config.mjs" \
            --project chromium

      - name: Run Wave 2B Stripe and RevenueCat sandbox proof when configured
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const Stripe = require("stripe");

          const artifactDir = process.env.ARTIFACT_DIR;
          const required = [
            { env: "WAVE2B_PREVIEW_URL", name: "WAVE2B_PREVIEW_URL" },
            { env: "WAVE2B_QA_EMAIL", name: "BLUNDR_QA_EMAIL" },
            { env: "WAVE2B_QA_PASSWORD", name: "BLUNDR_QA_PASSWORD" },
            { env: "WAVE2B_QA_SUPABASE_UUID", name: "WAVE2B_QA_SUPABASE_UUID" },
            { env: "STRIPE_SECRET_KEY", name: "STRIPE_SECRET_KEY" },
            { env: "STRIPE_PRO_MONTHLY_PRICE_ID", name: "STRIPE_PRO_MONTHLY_PRICE_ID" },
            { env: "STRIPE_PRO_ANNUAL_PRICE_ID", name: "STRIPE_PRO_ANNUAL_PRICE_ID" },
            { env: "REVENUECAT_REST_API_KEY", name: "REVENUECAT_REST_API_KEY" },
            { env: "REVENUECAT_PROJECT_ID", name: "REVENUECAT_PROJECT_ID" },
            { env: "REVENUECAT_PRO_ENTITLEMENT_ID", name: "REVENUECAT_PRO_ENTITLEMENT_ID" },
            { env: "REVENUECAT_OFFERING_ID", name: "REVENUECAT_OFFERING_ID" },
          ];
          const missing = required
            .filter((config) => !process.env[config.env])
            .map((config) => config.name);
          const proof = {
            status: missing.length ? "configuration_pending" : "started",
            missingConfigurationNames: missing,
            previewUrl: process.env.WAVE2B_PREVIEW_URL || null,
            checkoutSessionId: null,
            stripeEventIds: [],
            revenueCatSandboxCustomerId: null,
            entitlementBefore: null,
            entitlementAfter: null,
            checks: {},
          };

          function write() {
            fs.writeFileSync(
              `${artifactDir}/sandbox-proof.json`,
              `${JSON.stringify(proof, null, 2)}\n`,
            );
          }

          if (missing.length) {
            write();
            console.log(`Sandbox proof pending configuration: ${missing.join(", ")}`);
            process.exit(0);
          }
          if (!process.env.STRIPE_SECRET_KEY.startsWith("sk_test_")) {
            throw new Error("STRIPE_SECRET_KEY must be test-mode.");
          }
          if (process.env.REVENUECAT_PRO_ENTITLEMENT_ID !== "pro") {
            throw new Error("RevenueCat entitlement identifier must be pro.");
          }
          if (process.env.REVENUECAT_OFFERING_ID !== "default") {
            throw new Error("RevenueCat offering identifier must be default.");
          }

          (async () => {
            const stripe = new Stripe(process.env.STRIPE_SECRET_KEY);
            const monthly = await stripe.prices.retrieve(process.env.STRIPE_PRO_MONTHLY_PRICE_ID);
            const annual = await stripe.prices.retrieve(process.env.STRIPE_PRO_ANNUAL_PRICE_ID);
            if (monthly.livemode || annual.livemode) {
              throw new Error("Configured Stripe prices must be test-mode objects.");
            }
            if (!monthly.active || monthly.unit_amount !== 999 || monthly.recurring?.interval !== "month") {
              throw new Error("Monthly Stripe price does not match the Wave 2B contract.");
            }
            if (!annual.active || annual.unit_amount !== 6999 || annual.recurring?.interval !== "year") {
              throw new Error("Annual Stripe price does not match the Wave 2B contract.");
            }
            proof.checks.stripePriceVerified = true;

            if (process.env.WAVE2B_EXECUTE_SANDBOX_CHECKOUT !== "true") {
              proof.status = "operator_checkout_required";
              proof.operatorChecklist = [
                "Run the checked-out workflow with WAVE2B_EXECUTE_SANDBOX_CHECKOUT=true only in the wave2b-validation environment.",
                "Use the dedicated non-production QA account.",
                "Verify app-created Checkout uses only the monthly or annual enum and the expected test price.",
                "Record the redacted Checkout Session ID, Stripe event IDs, RevenueCat sandbox customer ID, and trusted entitlement before/after reconciliation in the workflow artifact.",
              ];
              write();
              console.log("Stripe prices verified. End-to-end sandbox checkout remains operator gated.");
              return;
            }

            proof.status = "automated_checkout_not_enabled";
            proof.operatorChecklist = [
              "The workflow guard verified test-mode Stripe price objects.",
              "Complete the hosted Checkout journey with the dedicated QA user from the preview URL.",
              "Confirm webhook and RevenueCat reconciliation evidence without printing credentials or personal data.",
            ];
            write();
            console.log("Automated checkout flag was enabled, but external hosted checkout/webhook proof requires operator evidence.");
          })().catch((error) => {
            proof.status = "failed";
            proof.error = error instanceof Error ? error.message : String(error);
            write();
            throw error;
          });
          NODE

      - name: Publish Wave 2B validation summary
        if: always()
        run: |
          {
            echo "## Wave 2B commercial validation"
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Tested SHA: $GITHUB_SHA"
            echo "- Environment: wave2b-validation"
            echo "- Preview URL: stored in WAVE2B_PREVIEW_URL"
            echo "- Responsive QA artifact: browser-qa-summary.json"
            echo "- Sandbox proof artifact: sandbox-proof.json"
            echo "- Production touched: no"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Wave 2B validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blundr-wave2b-commercial-validation-${{ github.sha }}
          path: ${{ github.workspace }}/.tmp/wave2b-commercial-validation
          if-no-files-found: warn
          retention-days: 30
