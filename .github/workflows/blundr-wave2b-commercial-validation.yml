name: Blundr Wave 2B commercial validation

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Exact immutable non-production deployment URL
        required: true
        type: string
      expected_sha:
        description: Exact 40-character candidate SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: blundr-wave2b-commercial-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser_qa_provider_config_and_blocked_sandbox_proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: wave2b-validation
    env:
      WAVE2B_PREVIEW_URL: ${{ inputs.preview_url }}
      WAVE2B_QA_EMAIL: ${{ secrets.BLUNDR_QA_EMAIL }}
      WAVE2B_QA_PASSWORD: ${{ secrets.BLUNDR_QA_PASSWORD }}
      WAVE2B_QA_SUPABASE_UUID: ${{ secrets.WAVE2B_QA_SUPABASE_UUID }}
      WAVE2B_EXPECTED_SHA: ${{ inputs.expected_sha }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PRO_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_PRO_MONTHLY_PRICE_ID }}
      STRIPE_PRO_ANNUAL_PRICE_ID: ${{ secrets.STRIPE_PRO_ANNUAL_PRICE_ID }}
      REVENUECAT_REST_API_KEY: ${{ secrets.REVENUECAT_REST_API_KEY }}
      REVENUECAT_V2_SECRET_API_KEY: ${{ secrets.REVENUECAT_V2_SECRET_API_KEY }}
      REVENUECAT_PROJECT_ID: ${{ secrets.REVENUECAT_PROJECT_ID }}
      REVENUECAT_PRO_ENTITLEMENT_ID: ${{ secrets.REVENUECAT_PRO_ENTITLEMENT_ID }}
      REVENUECAT_OFFERING_ID: ${{ secrets.REVENUECAT_OFFERING_ID }}
      BLUNDR_STAGING_SUPABASE_URL: ${{ secrets.BLUNDR_STAGING_SUPABASE_URL }}
      BLUNDR_STAGING_SUPABASE_SECRET_KEY: ${{ secrets.BLUNDR_STAGING_SUPABASE_SECRET_KEY }}
      ARTIFACT_DIR: ${{ github.workspace }}/.tmp/wave2b-commercial-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Print exact validation SHA
        run: echo "Exact SHA $GITHUB_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium only
        run: npx playwright install --with-deps chromium

      - name: Preflight non-production configuration
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const fs = require("node:fs");

          const artifactDir = process.env.ARTIFACT_DIR;
          const required = [
            { env: "WAVE2B_PREVIEW_URL", name: "WAVE2B_PREVIEW_URL" },
            { env: "WAVE2B_QA_EMAIL", name: "BLUNDR_QA_EMAIL" },
            { env: "WAVE2B_QA_PASSWORD", name: "BLUNDR_QA_PASSWORD" },
          ];
          const providerConfiguration = [
            { env: "WAVE2B_QA_SUPABASE_UUID", name: "WAVE2B_QA_SUPABASE_UUID" },
            { env: "STRIPE_SECRET_KEY", name: "STRIPE_SECRET_KEY" },
            { env: "STRIPE_PRO_MONTHLY_PRICE_ID", name: "STRIPE_PRO_MONTHLY_PRICE_ID" },
            { env: "STRIPE_PRO_ANNUAL_PRICE_ID", name: "STRIPE_PRO_ANNUAL_PRICE_ID" },
            { env: "REVENUECAT_REST_API_KEY", name: "REVENUECAT_REST_API_KEY" },
            { env: "REVENUECAT_V2_SECRET_API_KEY", name: "REVENUECAT_V2_SECRET_API_KEY" },
            { env: "REVENUECAT_PROJECT_ID", name: "REVENUECAT_PROJECT_ID" },
            { env: "REVENUECAT_PRO_ENTITLEMENT_ID", name: "REVENUECAT_PRO_ENTITLEMENT_ID" },
            { env: "REVENUECAT_OFFERING_ID", name: "REVENUECAT_OFFERING_ID" },
            { env: "BLUNDR_STAGING_SUPABASE_URL", name: "BLUNDR_STAGING_SUPABASE_URL" },
            { env: "BLUNDR_STAGING_SUPABASE_SECRET_KEY", name: "BLUNDR_STAGING_SUPABASE_SECRET_KEY" },
          ];
          const missingRequired = required
            .filter((config) => !process.env[config.env])
            .map((config) => config.name);
          const missingProviderConfiguration = providerConfiguration
            .filter((config) => !process.env[config.env])
            .map((config) => config.name);

          const result = {
            workflow: process.env.GITHUB_WORKFLOW,
            runId: process.env.GITHUB_RUN_ID,
            sha: process.env.GITHUB_SHA,
            previewHost: null,
            preflight: "failed",
            missingRequired,
            missingProviderConfiguration,
            providerConfigurationAvailable:
              missingProviderConfiguration.length === 0,
            sandboxIntegrationProof: "blocked_until_real_provider_journey",
          };

          function fail(message) {
            result.failure = message;
            fs.writeFileSync(
              `${artifactDir}/preflight.json`,
              `${JSON.stringify(result, null, 2)}\n`,
            );
            console.error(message);
            if (missingRequired.length) {
              console.error(`Missing required configuration: ${missingRequired.join(", ")}`);
            }
            if (missingProviderConfiguration.length) {
              console.error(`Missing provider configuration: ${missingProviderConfiguration.join(", ")}`);
            }
            process.exit(1);
          }

          if (missingRequired.length) {
            fail("Wave 2B validation preflight failed.");
          }
          if (!/^[0-9a-f]{40}$/i.test(process.env.WAVE2B_EXPECTED_SHA || "")) {
            fail("expected_sha must be exactly 40 hexadecimal characters.");
          }
          const checkedOutHead = execFileSync("git", ["rev-parse", "HEAD"], {
            encoding: "utf8",
          }).trim();
          result.checkedOutHeadMatchesExpected =
            checkedOutHead.toLowerCase() ===
            process.env.WAVE2B_EXPECTED_SHA.toLowerCase();
          if (!result.checkedOutHeadMatchesExpected) {
            fail("expected_sha does not match the checked-out HEAD.");
          }

          let preview;
          try {
            preview = new URL(process.env.WAVE2B_PREVIEW_URL);
          } catch {
            fail("WAVE2B_PREVIEW_URL is not a valid URL.");
          }

          const host = preview.hostname.toLowerCase();
          result.previewHost = host;
          const blockedHosts = new Set([
            "blundr.com",
            "www.blundr.com",
            "app.blundr.com",
            "blundr.ai",
            "www.blundr.ai",
            "blundr.vercel.app",
          ]);
          if (preview.protocol !== "https:") {
            fail("WAVE2B_PREVIEW_URL must use HTTPS.");
          }
          if (blockedHosts.has(host)) {
            fail("WAVE2B_PREVIEW_URL resolves to a production Blundr host.");
          }
          if (host === "localhost" || host.endsWith(".local")) {
            fail("WAVE2B_PREVIEW_URL must be a remote non-production preview.");
          }
          if (process.env.STRIPE_SECRET_KEY?.startsWith("sk_live_")) {
            fail("Live-mode Stripe credentials are forbidden for Wave 2B validation.");
          }
          if (process.env.STRIPE_SECRET_KEY && !process.env.STRIPE_SECRET_KEY.startsWith("sk_test_")) {
            fail("STRIPE_SECRET_KEY must be test-mode when provided.");
          }
          if (
            process.env.REVENUECAT_PRO_ENTITLEMENT_ID &&
            process.env.REVENUECAT_PRO_ENTITLEMENT_ID !== "pro"
          ) {
            fail("RevenueCat entitlement identifier must be pro.");
          }
          if (
            process.env.REVENUECAT_OFFERING_ID &&
            process.env.REVENUECAT_OFFERING_ID !== "default"
          ) {
            fail("RevenueCat offering identifier must be default.");
          }

          result.preflight = "passed";
          fs.writeFileSync(
            `${artifactDir}/preflight.json`,
            `${JSON.stringify(result, null, 2)}\n`,
          );
          console.log("Wave 2B validation preflight passed.");
          if (missingProviderConfiguration.length) {
            console.log(`Provider configuration not complete: ${missingProviderConfiguration.join(", ")}`);
          }
          NODE

      - name: Verify preview commit identity when exposed
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const artifactDir = process.env.ARTIFACT_DIR;
          const base = process.env.WAVE2B_PREVIEW_URL.replace(/\/+$/, "");
          const expected = process.env.WAVE2B_EXPECTED_SHA.toLowerCase();

          async function readJson(path) {
            const response = await fetch(`${base}${path}`, { redirect: "manual" });
            try {
              return { ok: response.ok, status: response.status, body: await response.json() };
            } catch {
              return { ok: response.ok, status: response.status, body: null };
            }
          }

          function readPath(value, path) {
            return path.reduce((current, key) => current && typeof current === "object" ? current[key] : undefined, value);
          }

          function extractSha(body) {
            if (!body || typeof body !== "object") return null;
            const paths = [
              ["gitSha"],
              ["sha"],
              ["commit"],
              ["buildGitSha"],
              ["build", "gitSha"],
              ["build", "sha"],
              ["build", "commit"],
              ["build", "buildGitSha"],
            ];
            for (const path of paths) {
              const value = readPath(body, path);
              if (typeof value === "string" && /^[0-9a-f]{40}$/i.test(value)) return value.toLowerCase();
            }
            return null;
          }

          function summarizeBody(body) {
            if (!body || typeof body !== "object") return null;
            return {
              ready: typeof body.ready === "boolean" ? body.ready : null,
              buildReady: typeof body.build?.ready === "boolean" ? body.build.ready : null,
              buildIssues: Array.isArray(body.build?.issues) ? body.build.issues.map(String) : [],
              errorCode: typeof body.error === "string" ? body.error : typeof body.error?.code === "string" ? body.error.code : null,
            };
          }

          const probes = ["/api/health", "/api/build-info"];
          const observations = [];
          for (const path of probes) {
            const result = await readJson(path);
            const candidate = extractSha(result.body);
            const redacted = { path, ok: result.ok, status: result.status, exposedSha: candidate, summary: summarizeBody(result.body) };
            observations.push(redacted);
          }
          const health = observations.find((observation) => observation.path === "/api/health");
          const mismatches = observations.filter(
            (observation) => observation.exposedSha && observation.exposedSha !== expected,
          );
          const identity = {
            expectedSha: expected,
            checked: observations,
            status:
              health?.exposedSha === expected && mismatches.length === 0
                ? "matched"
                : mismatches.length
                  ? "mismatched"
                  : "not_exposed",
          };
          fs.writeFileSync(
            `${artifactDir}/preview-identity.json`,
            `${JSON.stringify(identity, null, 2)}\n`,
          );
          if (identity.status === "mismatched") {
            throw new Error("Preview deployment metadata exposes a different SHA.");
          }
          if (health?.exposedSha !== expected) {
            throw new Error("/api/health did not expose the expected SHA.");
          }
          if (identity.status === "not_exposed") {
            throw new Error("Preview deployment metadata did not expose a supported SHA field.");
          }
          console.log(`Preview SHA identity ${identity.status}.`);
          NODE

      - name: Run Wave 2B browser QA
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR/screenshots"
          node scripts/wave2b-browser-qa.mjs

      - name: Run Wave 2B provider configuration check
        run: |
          set -euo pipefail
          node scripts/wave2b-provider-configuration-check.mjs

      - name: Require real Wave 2B sandbox integration proof
        run: |
          set -euo pipefail
          node scripts/wave2b-sandbox-integration-proof.mjs

      - name: Publish Wave 2B validation summary
        if: always()
        run: |
          {
            echo "## Wave 2B commercial validation"
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Tested SHA: $WAVE2B_EXPECTED_SHA"
            echo "- Environment: wave2b-validation"
            echo "- Preview URL: workflow_dispatch input preview_url"
            echo "- Browser contract QA artifact: browser-qa-summary.json"
            echo "- Provider configuration artifact: provider-configuration-check.json"
            echo "- Sandbox integration proof artifact: sandbox-integration-proof.json"
            echo "- Production touched: no"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Wave 2B validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blundr-wave2b-commercial-validation-${{ github.sha }}
          path: ${{ github.workspace }}/.tmp/wave2b-commercial-validation
          if-no-files-found: warn
          retention-days: 30
