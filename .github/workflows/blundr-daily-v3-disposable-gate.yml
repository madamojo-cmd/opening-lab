name: Blundr Daily v3 disposable gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blundr-disposable-rls-fresh
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: blundr-disposable-rls
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BLUNDR_RLS_FRESH_PROJECT_REF: ${{ secrets.BLUNDR_RLS_FRESH_PROJECT_REF }}
      BLUNDR_RLS_UPGRADE_PROJECT_REF: ${{ secrets.BLUNDR_RLS_UPGRADE_PROJECT_REF }}
      BLUNDR_RLS_TEST_PROJECT_REF: ${{ secrets.BLUNDR_RLS_TEST_PROJECT_REF }}
      BLUNDR_RLS_TEST_ENVIRONMENT_ROLE: ${{ secrets.BLUNDR_RLS_TEST_ENVIRONMENT_ROLE }}
      BLUNDR_RLS_TEST_USER_A_EMAIL: ${{ secrets.BLUNDR_RLS_TEST_USER_A_EMAIL }}
      BLUNDR_RLS_TEST_USER_A_PASSWORD: ${{ secrets.BLUNDR_RLS_TEST_USER_A_PASSWORD }}
      BLUNDR_RLS_TEST_USER_B_EMAIL: ${{ secrets.BLUNDR_RLS_TEST_USER_B_EMAIL }}
      BLUNDR_RLS_TEST_USER_B_PASSWORD: ${{ secrets.BLUNDR_RLS_TEST_USER_B_PASSWORD }}
      LOG_DIR: ${{ github.workspace }}/.tmp/blundr-daily-v3-logs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Print exact tested SHA
        run: echo "Exact SHA $GITHUB_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Verify local migration set
        run: npm run verify:migrations

      - name: Require disposable test environment
        run: |
          set -eu
          for name in \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_DB_PASSWORD \
            BLUNDR_RLS_FRESH_PROJECT_REF \
            BLUNDR_RLS_UPGRADE_PROJECT_REF \
            BLUNDR_RLS_TEST_PROJECT_REF \
            BLUNDR_RLS_TEST_ENVIRONMENT_ROLE \
            BLUNDR_RLS_TEST_USER_A_EMAIL \
            BLUNDR_RLS_TEST_USER_A_PASSWORD \
            BLUNDR_RLS_TEST_USER_B_EMAIL \
            BLUNDR_RLS_TEST_USER_B_PASSWORD
          do
            test -n "${!name:-}" || { echo "$name is required"; exit 1; }
          done
          test "$BLUNDR_RLS_FRESH_PROJECT_REF" != "$BLUNDR_RLS_UPGRADE_PROJECT_REF" || {
            echo "Fresh and upgrade project refs must be distinct"
            exit 1
          }
          test "$BLUNDR_RLS_TEST_PROJECT_REF" = "$BLUNDR_RLS_UPGRADE_PROJECT_REF" || {
            echo "Test and upgrade project refs must match"
            exit 1
          }
          test "$BLUNDR_RLS_TEST_ENVIRONMENT_ROLE" = "disposable" || {
            echo "Remote target must be disposable"
            exit 1
          }

      - name: Confirm disposable project and export keys
        env:
          BLUNDR_PR01_PREFLIGHT_MODE: fresh
          BLUNDR_PR01_PREFLIGHT_PROJECT_REF: ${{ secrets.BLUNDR_RLS_FRESH_PROJECT_REF }}
          BLUNDR_PR01_EXPORT_API_KEYS: "true"
        run: npm run verify:pr01-disposable-project

      - name: Link disposable project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          log="$LOG_DIR/link.log"
          command_log="$(mktemp)"
          if ! npx --yes supabase@2.111.0 link --project-ref "$BLUNDR_RLS_FRESH_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" >"$command_log" 2>&1; then
            cat "$command_log"
            rm -f "$command_log"
            exit 1
          fi
          if grep -q '"_tag":"Error"' "$command_log"; then
            cat "$command_log"
            rm -f "$command_log"
            exit 1
          fi
          cat "$command_log" | tee "$log" >/dev/null
          rm -f "$command_log"

      - name: Promote fresh project for downstream authority tests
        shell: bash
        run: |
          set -euo pipefail
          echo "BLUNDR_RLS_TEST_PROJECT_REF=$BLUNDR_RLS_FRESH_PROJECT_REF" >> "$GITHUB_ENV"

      - name: Restore PR-01 baseline from reusable disposable project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          log="$LOG_DIR/db-reset-to-pr01-baseline.log"
          command_log="$(mktemp)"
          if ! npx --yes supabase@2.111.0 --yes db reset --linked --version 20260805150000 --no-seed >"$command_log" 2>&1; then
            cat "$command_log"
            rm -f "$command_log"
            exit 1
          fi
          if grep -q '"_tag":"Error"' "$command_log"; then
            cat "$command_log"
            rm -f "$command_log"
            exit 1
          fi
          cat "$command_log" | tee "$log" >/dev/null
          rm -f "$command_log"

      - name: Verify remote migration history starts at PR-01 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          log="$LOG_DIR/migrations-pr01-before-upgrade.log"
          BLUNDR_EXPECTED_MIGRATION_COUNT=25 BLUNDR_EXPECTED_MIGRATION_HEAD=20260805150000 \
            npm run verify:remote-migration-history | tee "$log"

      - name: Prove 25→38 upgrade path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          require_dry_run_migrations() {
            expected_file="$1"
            command_log="$(mktemp)"
            actual_file="$(mktemp)"
            if ! npx --yes supabase@2.111.0 db push --dry-run >"$command_log" 2>&1; then
              rm -f "$command_log" "$actual_file" "$expected_file"
              echo "Supabase migration dry-run failed without emitting target details"
              exit 1
            fi
            expected_count="$(wc -l <"$expected_file" | tr -d ' ')"
            grep -oE '[0-9]{8}([0-9]{6})?_[A-Za-z0-9._-]+\.sql' "$command_log" | tail -n "$expected_count" >"$actual_file" || true
            if ! cmp -s "$expected_file" "$actual_file"; then
              cat "$command_log"
              rm -f "$command_log" "$actual_file" "$expected_file"
              echo "Supabase migration dry-run did not contain the exact expected migration set"
              exit 1
            fi
            cat "$command_log" | tee "$LOG_DIR/db-push-dry-run.log" >/dev/null
            rm -f "$command_log" "$actual_file" "$expected_file"
            echo "Validated sanitized migration dry-run with $expected_count expected migrations"
          }
          expected_upgrade_migrations="$(mktemp)"
          find supabase/migrations -maxdepth 1 -name '*.sql' -type f -printf '%f\n' | sort | tail -n 12 >"$expected_upgrade_migrations"
          require_dry_run_migrations "$expected_upgrade_migrations"
          command_log="$(mktemp)"
          if ! npx --yes supabase@2.111.0 db push >"$command_log" 2>&1; then
            cat "$command_log"
            rm -f "$command_log"
            exit 1
          fi
          if grep -q '"_tag":"Error"' "$command_log"; then
            cat "$command_log"
            rm -f "$command_log"
            exit 1
          fi
          cat "$command_log" | tee "$LOG_DIR/db-push-upgrade.log" >/dev/null
          rm -f "$command_log"

      - name: Verify remote migration history reached 38 after upgrade
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          log="$LOG_DIR/migrations-after-upgrade.log"
          BLUNDR_EXPECTED_MIGRATION_COUNT=38 BLUNDR_EXPECTED_MIGRATION_HEAD=20260817203000 \
            npm run verify:remote-migration-history | tee "$log"

      - name: Validate linked reset support
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          help_log="$LOG_DIR/db-reset-help.log"
          command_log="$(mktemp)"
          if ! npx --yes supabase@2.111.0 db reset --help >"$command_log" 2>&1; then
            cat "$command_log"
            rm -f "$command_log"
            exit 1
          fi
          if ! grep -q -- '--linked' "$command_log"; then
            cat "$command_log"
            rm -f "$command_log"
            echo "Supabase db reset help did not advertise --linked"
            exit 1
          fi
          if ! grep -q -- '--no-seed' "$command_log"; then
            cat "$command_log"
            rm -f "$command_log"
            echo "Supabase db reset help did not advertise --no-seed"
            exit 1
          fi
          cat "$command_log" | tee "$help_log" >/dev/null
          rm -f "$command_log"

      - name: Rebuild disposable project from local migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          log="$LOG_DIR/db-reset-linked.log"
          command_log="$(mktemp)"
          if ! npx --yes supabase@2.111.0 --yes db reset --linked --no-seed >"$command_log" 2>&1; then
            cat "$command_log"
            rm -f "$command_log"
            exit 1
          fi
          if grep -q '"_tag":"Error"' "$command_log"; then
            cat "$command_log"
            rm -f "$command_log"
            exit 1
          fi
          cat "$command_log" | tee "$log" >/dev/null
          rm -f "$command_log"

      - name: Verify rebuilt remote migration history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          log="$LOG_DIR/migrations-after-reset.log"
          BLUNDR_EXPECTED_MIGRATION_COUNT=38 BLUNDR_EXPECTED_MIGRATION_HEAD=20260817203000 \
            npm run verify:remote-migration-history | tee "$log"

      - name: Promote fresh project for downstream authority tests
        shell: bash
        run: |
          set -euo pipefail
          echo "BLUNDR_RLS_TEST_PROJECT_REF=$BLUNDR_RLS_FRESH_PROJECT_REF" >> "$GITHUB_ENV"

      - name: Assert downstream fresh target
        shell: bash
        run: |
          set -euo pipefail
          test "$BLUNDR_RLS_TEST_PROJECT_REF" = "$BLUNDR_RLS_FRESH_PROJECT_REF" || {
            echo "Downstream tests must target the fresh disposable project"
            exit 1
          }

      - id: daily_v3_remote_authority
        name: Daily v3 remote authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          npm run test:daily-v3-remote-authority | tee "$LOG_DIR/daily-v3-remote-authority.log"

      - id: pr02_learning_and_daily_authority_regression
        name: PR-02 learning and Daily authority regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          npm run test:pr02-remote-authority | tee "$LOG_DIR/pr02-remote-authority.log"

      - id: pr03_rewards_grant_and_presentation_regression
        name: PR-03 rewards grant and presentation regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          npm run test:pr03-remote-authority | tee "$LOG_DIR/pr03-remote-authority.log"

      - id: durable_trainer_completion_authority_regression
        name: Durable trainer completion authority regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          node --preserve-symlinks --import tsx tests/security/trainerCompletionRemoteAuthority.integration.test.ts | tee "$LOG_DIR/trainer-completion-remote-authority.log"

      - id: pr01_migration_authority_regression
        name: PR-01 migration authority regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          echo "Running pr01MigrationAuthority.integration.test.ts"
          node --preserve-symlinks --import tsx tests/security/pr01MigrationAuthority.integration.test.ts | tee "$LOG_DIR/pr01-migration-authority.log"

      - id: learning_core_rls_cross_user_isolation_matrix
        name: Learning core RLS and cross-user isolation matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          echo "Running learningCoreRls.integration.test.ts"
          node --preserve-symlinks --import tsx tests/security/learningCoreRls.integration.test.ts | tee "$LOG_DIR/learning-core-rls.log"

      - id: local_daily_rewards_ring_and_security_contracts
        name: Daily composition and fallback tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          node --preserve-symlinks --import tsx lib/blundr/daily/__tests__/productionDailyRuntimeComposition.test.ts | tee "$LOG_DIR/production-daily-runtime-composition.log"
      - id: rewards_server_authoritative_contract
        name: Rewards v2 server authority contract tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          node --preserve-symlinks --import tsx lib/blundr/rewards/__tests__/serverAuthoritativeRewards.test.ts | tee "$LOG_DIR/server-authoritative-rewards.log"

      - id: daily_rings_read_only_authority
        name: Daily ring authenticated writer-isolation tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          node --preserve-symlinks --import tsx components/daily-rings/__tests__/dailyRingsReadOnlyAuthority.test.ts | tee "$LOG_DIR/daily-rings-read-only-authority.log"

      - id: reward_presentation_host_contract_tests
        name: Reward presentation host contract tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          node --preserve-symlinks --import tsx components/rewards/__tests__/RewardPresentationHost.contract.test.ts | tee "$LOG_DIR/reward-presentation-host.contract.log"

      - id: security_baseline
        name: Security baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          node --preserve-symlinks --import tsx tests/security/securityBaseline.test.ts | tee "$LOG_DIR/security-baseline.log"
          node --preserve-symlinks --import tsx tests/security/deepMinigameCatalogSafety.test.ts | tee "$LOG_DIR/deep-minigame-catalog-safety.log"
          node --preserve-symlinks --import tsx tests/security/sentryPrivacy.test.ts | tee "$LOG_DIR/sentry-privacy.log"
          node --preserve-symlinks --import tsx tests/security/sentryVerificationRoute.test.ts | tee "$LOG_DIR/sentry-verification-route.log"

      - id: protected_runtime_hash_verification
        name: Protected runtime hash verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          node --preserve-symlinks --import tsx tests/runtimeBook/stage2Final21RuntimePackageAcceptance.test.ts | tee "$LOG_DIR/stage2-final-21-runtime-package-acceptance.log"

      - name: Publish gate summary
        if: always()
        run: |
          {
            echo "## Daily v3 disposable gate"
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Tested SHA: $GITHUB_SHA"
            echo "- Disposable environment role: $BLUNDR_RLS_TEST_ENVIRONMENT_ROLE"
            echo "- Migration count: 38"
            echo "- Migration head: 20260817203000"
            echo "- Daily v3 remote authority: ${{ steps.daily_v3_remote_authority.outcome }}"
            echo "- PR-02 regression: ${{ steps.pr02_learning_and_daily_authority_regression.outcome }}"
            echo "- PR-03 regression: ${{ steps.pr03_rewards_grant_and_presentation_regression.outcome }}"
            echo "- Trainer regression: ${{ steps.durable_trainer_completion_authority_regression.outcome }}"
            echo "- PR-01 migration authority regression: ${{ steps.pr01_migration_authority_regression.outcome }}"
            echo "- Learning core RLS and cross-user isolation matrix: ${{ steps.learning_core_rls_cross_user_isolation_matrix.outcome }}"
            echo "- Daily composition and fallback tests: ${{ steps.local_daily_rewards_ring_and_security_contracts.outcome }}"
            echo "- Rewards v2 server authority contract tests: ${{ steps.rewards_server_authoritative_contract.outcome }}"
            echo "- Daily ring authenticated writer-isolation tests: ${{ steps.daily_rings_read_only_authority.outcome }}"
            echo "- Reward presentation host contract tests: ${{ steps.reward_presentation_host_contract_tests.outcome }}"
            echo "- Security baseline: ${{ steps.security_baseline.outcome }}"
            echo "- Protected runtime hash verification: ${{ steps.protected_runtime_hash_verification.outcome }}"
            echo "- Skipped tests: 0"
            echo "- Logs: uploaded as artifact from $LOG_DIR"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blundr-daily-v3-disposable-gate-${{ github.sha }}
          path: ${{ github.workspace }}/.tmp/blundr-daily-v3-logs
          if-no-files-found: warn
          retention-days: 30
