services:
  maia:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MAIA_SERVICE_TOKEN: "replace-with-at-least-32-random-characters"
      MAIA_BACKEND: "blas"
      MAIA_REQUEST_TIMEOUT_MS: "2500"
      MAIA_QUEUE_LIMIT: "32"
      MAIA_MAX_WARM_WORKERS: "3"
      MAIA_PREWARM_SKILLS: "maia-1100,maia-1500,maia-1900"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.mjs"]
      interval: 30s
      timeout: 3s
      start_period: 45s
      retries: 3
